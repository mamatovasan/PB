<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проблемные билеты ДЭСД — Казахстан</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#11243a;--text:#edf5ff;--muted:#8fa8c2;--line:#213a55;--red:#ff4058;--yellow:#ffc247;--green:#36d17c;--blue:#3d9cff}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#07111f;color:var(--text)}header{padding:17px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:#081522}.brand{font-weight:850;font-size:20px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.2px;margin-top:4px}.top{display:flex;gap:8px;flex-wrap:wrap}.pill,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 12px;font-weight:700}.btn{cursor:pointer}.btn:hover{border-color:var(--blue)}main{max-width:1500px;margin:auto;padding:20px}.layout{display:grid;grid-template-columns:minmax(700px,1.6fr) minmax(350px,.75fr);gap:18px}.card{background:linear-gradient(#0d1b2d,#091624);border:1px solid var(--line);border-radius:18px}.map-card{padding:18px}.map{height:690px;position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(#0b2034,#081725);border:1px solid #1c3854}.kz{position:absolute;inset:6% 3%;background:#173553;border:3px solid #4d88b4;clip-path:polygon(2% 40%,7% 33%,10% 24%,17% 20%,24% 22%,31% 15%,38% 12%,45% 15%,52% 11%,60% 15%,67% 21%,73% 18%,81% 22%,88% 27%,94% 34%,98% 45%,95% 54%,89% 57%,91% 65%,87% 71%,80% 73%,76% 80%,68% 78%,62% 85%,55% 91%,48% 86%,42% 88%,35% 82%,28% 88%,22% 82%,17% 77%,11% 76%,7% 68%,3% 60%);filter:drop-shadow(0 14px 28px #0008)}.kz:after{content:"КАЗАХСТАН";position:absolute;left:38%;top:48%;font-size:40px;font-weight:900;letter-spacing:6px;color:#ffffff10}.city{position:absolute;z-index:3;transform:translate(-50%,-50%);cursor:pointer;text-align:center}.pin{width:12px;height:12px;border-radius:50%;background:#d9efff;border:3px solid #fff;box-shadow:0 0 0 5px #3d9cff33;margin:auto}.name{font-size:11px;font-weight:800;margin-top:5px;white-space:nowrap;text-shadow:0 2px 5px #000}.badge{position:absolute;top:-15px;right:-18px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--red);font-size:11px;font-weight:900;display:grid;place-items:center;border:2px solid #081725}.badge.zero{background:#42566a;color:#b8c8d8}.side{padding:18px;min-height:690px}.muted{color:var(--muted);font-size:12px}.unit{margin:9px 0;border:1px solid var(--line);background:var(--panel2);border-radius:12px;overflow:hidden}.unit-head{padding:14px;display:flex;justify-content:space-between;cursor:pointer;font-weight:800}.unit-head:hover{background:#15304b}.count{background:#ff405822;color:#ff8090;border-radius:8px;padding:5px 8px}.unit-body{display:none;padding:0 12px 12px}.unit.open .unit-body{display:block}.ticket{background:#091827;border:1px solid var(--line);border-radius:11px;padding:11px;margin:8px 0}.ticket b{font-size:13px}.ticket p{margin:6px 0;color:#b9c9d8;font-size:12px;line-height:1.4}.status{font-size:11px;font-weight:800}.s-open{color:#ff7185}.s-work{color:#ffd06b}.actions{display:flex;gap:6px;margin-top:8px}.small{font-size:11px;padding:6px 8px}.history{margin-top:15px;border-top:1px solid var(--line);padding-top:13px}.history-box{display:none}.history.open .history-box{display:block}.empty{color:var(--muted);font-size:12px;padding:10px}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:center;justify-content:center}.modal.show{display:flex}.modal-box{width:min(390px,92vw);background:#0d1b2d;border:1px solid var(--line);border-radius:16px;padding:20px}.modal input{width:100%;padding:11px;background:#07111f;color:white;border:1px solid var(--line);border-radius:9px;margin:10px 0}.modal .row{display:flex;gap:8px;justify-content:flex-end}@media(max-width:950px){.layout{grid-template-columns:1fr}.map{height:560px}.top{display:none}}@media(max-width:650px){main{padding:8px}.map{height:470px}.brand{font-size:15px}.name{font-size:9px}}
</style></head><body>
<header><div class="brand">ПРОБЛЕМНЫЕ БИЛЕТЫ ДЭСД<small>КАРТА КАЗАХСТАНА • МОНИТОРИНГ</small></div><div class="top"><div class="pill">🔴 Открыто: <b id="openTotal">0</b></div><button class="btn" onclick="exportExcel()">⬇ Выгрузить в Excel</button></div></header>
<main><div class="layout"><section class="card map-card"><h2 style="margin:0 0 4px">Карта Казахстана</h2><div class="muted" style="margin-bottom:12px">Нажмите на город, чтобы открыть ДЭСД и подразделения</div><div class="map" id="map"><div class="kz"></div></div></section><aside class="card side"><div id="side"><h2>Выберите город</h2><p class="muted">Красная цифра показывает количество активных проблемных билетов.</p></div></aside></div></main>
<div class="modal" id="adminModal"><div class="modal-box"><h3 style="margin-top:0">🔐 Закрытие билета</h3><div class="muted">Введите код администратора</div><input id="adminCode" type="password" placeholder="Код администратора"><div class="row"><button class="btn" onclick="hideModal()">Отмена</button><button class="btn" onclick="confirmClose()">Закрыть билет</button></div></div></div>
<script>
// ДЕМО-РЕЖИМ. Позже заменим на API вашей базы.
const ADMIN_CODE='2580';
const cities=[
{name:'Уральск',desd:'Западно-Казахстанский ДЭСД',x:10,y:38},{name:'Атырау',desd:'Атырауский ДЭСД',x:12,y:55},{name:'Актау',desd:'Мангистауский ДЭСД',x:14,y:75},{name:'Актобе',desd:'Актюбинский ДЭСД',x:27,y:43},{name:'Костанай',desd:'Костанайский ДЭСД',x:43,y:25},{name:'Кокшетау',desd:'Акмолинский ДЭСД',x:54,y:27},{name:'Астана',desd:'ДЭСД Астана',x:56,y:36},{name:'Павлодар',desd:'Павлодарский ДЭСД',x:70,y:32},{name:'Семей',desd:'Восточно-Казахстанский ДЭСД',x:80,y:43},{name:'Өскемен',desd:'Восточно-Казахстанский ДЭСД',x:88,y:48},{name:'Караганда',desd:'Карагандинский ДЭСД',x:58,y:48},{name:'Кызылорда',desd:'Кызылординский ДЭСД',x:40,y:67},{name:'Тараз',desd:'Жамбылский ДЭСД',x:57,y:79},{name:'Талдыкорган',desd:'ДЭСД Жетісу',x:74,y:72},{name:'Алматы',desd:'ДЭСД Алматы',x:70,y:82}];
let tickets=[
{id:1,num:'PB-1001',desd:'Актюбинский ДЭСД',unit:'ЦЭиК',address:'Актобе, объект 12',desc:'Повреждение линии связи',status:'OPEN',created:'24.09.2026 18:40'},
{id:2,num:'PB-1002',desd:'Актюбинский ДЭСД',unit:'ЦТО МС',address:'Актобе, АТС-54',desc:'Нет связи',status:'IN_PROGRESS',created:'24.09.2026 19:05'},
{id:3,num:'PB-1003',desd:'Атырауский ДЭСД',unit:'ЦТПСР',address:'Атырау, узел 7',desc:'Аварийный сигнал',status:'OPEN',created:'24.09.2026 19:15'}];
let closed=[];let selectedCity=null;let closeId=null;
function activeFor(desd){return tickets.filter(t=>t.desd===desd&&t.status!=='CLOSED')}
function renderMap(){const map=document.getElementById('map');map.querySelectorAll('.city').forEach(e=>e.remove());cities.forEach(c=>{const n=activeFor(c.desd).length;const el=document.createElement('div');el.className='city';el.style.left=c.x+'%';el.style.top=c.y+'%';el.innerHTML=`<div class="pin"></div><div class="name">${c.name}</div><div class="badge ${n?'':'zero'}">${n}</div>`;el.onclick=()=>openCity(c);map.appendChild(el)});document.getElementById('openTotal').textContent=tickets.filter(t=>t.status!=='CLOSED').length}
function openCity(c){selectedCity=c;renderSide()}
function renderSide(){const c=selectedCity;if(!c)return;const units=['ЦТО МС','ЦЭиК','ЦТПСР'];let html=`<h2>${c.name}</h2><div class="muted">${c.desd}</div><div style="margin-top:15px">`;units.forEach(u=>{const list=activeFor(c.desd).filter(t=>t.unit===u);html+=`<div class="unit" id="u-${u.replaceAll(' ','')}"><div class="unit-head" onclick="this.parentElement.classList.toggle('open')"><span>${u}</span><span class="count">🔴 ${list.length}</span></div><div class="unit-body">${list.length?list.map(ticketHTML).join(''):'<div class="empty">Нет активных ПБ</div>'}</div></div>`});const hist=closed.filter(t=>t.desd===c.desd);html+=`</div><div class="history" id="history"><button class="btn" style="width:100%" onclick="document.getElementById('history').classList.toggle('open')">🕘 История закрытых билетов (${hist.length})</button><div class="history-box">${hist.length?hist.map(t=>`<div class="ticket"><b>🟢 ${t.num}</b><p>${t.unit}<br>${t.address}<br>${t.desc}</p></div>`).join(''):'<div class="empty">Закрытых билетов нет</div>'}</div></div>`;document.getElementById('side').innerHTML=html}
function ticketHTML(t){return `<div class="ticket"><b>🎫 ${t.num}</b> <span class="status ${t.status==='OPEN'?'s-open':'s-work'}">${t.status==='OPEN'?'🔴 Открыт':'🟡 В работе'}</span><p>📍 ${t.address}<br>📝 ${t.desc}<br>🕐 ${t.created}</p><div class="actions"><button class="btn small" onclick="event.stopPropagation();askClose(${t.id})">🟢 Закрыть билет</button></div></div>`}
function askClose(id){closeId=id;document.getElementById('adminCode').value='';document.getElementById('adminModal').classList.add('show')}
function hideModal(){document.getElementById('adminModal').classList.remove('show');closeId=null}
function confirmClose(){if(document.getElementById('adminCode').value!==ADMIN_CODE){alert('Неверный код администратора');return}const i=tickets.findIndex(t=>t.id===closeId);if(i>=0){const t={...tickets[i],status:'CLOSED',closed:new Date().toLocaleString('ru-RU')};closed.unshift(t);tickets.splice(i,1)}hideModal();renderMap();renderSide()}
function exportExcel(){const all=[...tickets,...closed];const rows=[['ID','Билет','ДЭСД','Подразделение','Адрес','Описание','Статус','Создан'],...all.map(t=>[t.id,t.num,t.desd,t.unit,t.address,t.desc,t.status,t.created])];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='problemnye-bilety.csv';a.click();URL.revokeObjectURL(a.href)}
renderMap();
</script></body></html>
